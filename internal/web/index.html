<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>待办清单 Todo List</title>
<style>
  :root {
    --bg: #eef0f3;
    --panel: #ffffff;
    --field: #e6e9ee;
    --ink: #15191f;
    --muted: #5b6472;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --danger: #d92626;
    --danger-hover: #b81d1d;
    --neutral: #dfe3e8;
    --neutral-hover: #cdd3da;
    /* 三列状态色：未开始=蓝，进行中=琥珀，已完成=绿 */
    --todo: #2563eb;
    --todo-bg: #e7efff;
    --doing: #b45309;
    --doing-bg: #fbeedb;
    --done: #15803d;
    --done-bg: #e2f5e9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  header { padding: 24px 24px 0; }
  h1 { margin: 0 0 16px; font-size: 22px; font-weight: 800; letter-spacing: 0; }
  .add-form {
    display: flex; gap: 8px; flex-wrap: wrap;
    padding: 12px; background: var(--panel); border-radius: 4px;
  }
  .add-form input {
    flex: 1 1 200px; min-width: 0; padding: 10px 12px;
    border: 0; border-radius: 2px;
    font: inherit; background: var(--field); color: inherit;
  }
  .add-form input::placeholder { color: var(--muted); }
  .add-form input:focus { outline: 2px solid var(--accent); outline-offset: 0; }
  button {
    font: inherit; font-weight: 600; padding: 8px 14px; border-radius: 2px;
    border: 0; background: var(--neutral); color: var(--ink);
    cursor: pointer; white-space: nowrap;
  }
  button:hover { background: var(--neutral-hover); }
  button.primary { background: var(--accent); color: #fff; }
  button.primary:hover { background: var(--accent-hover); }
  button.danger { background: var(--danger); color: #fff; }
  button.danger:hover { background: var(--danger-hover); }
  #board {
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 16px; padding: 16px 24px 32px; align-items: start;
  }
  .column {
    --status: var(--todo);
    background: var(--todo-bg); border-radius: 4px;
    padding: 12px; min-height: 160px;
  }
  .column:nth-child(2) { --status: var(--doing); background: var(--doing-bg); }
  .column:nth-child(3) { --status: var(--done); background: var(--done-bg); }
  .column h2 {
    margin: 0 0 12px; font-size: 14px; font-weight: 700; letter-spacing: .5px;
    padding: 8px 10px; border-radius: 2px;
    background: var(--status); color: #fff;
  }
  .empty { margin: 6px 4px; color: var(--muted); font-size: 13px; }
  .card {
    background: var(--panel); border-left: 3px solid var(--status);
    border-radius: 2px; padding: 10px 12px; margin-bottom: 10px;
    cursor: pointer;
  }
  .card.selected { outline: 2px solid var(--accent); outline-offset: 0; }
  .card h3 { margin: 0; font-size: 15px; font-weight: 600; line-height: 1.4; word-break: break-word; }
  .card .done { text-decoration: line-through; color: var(--muted); }
  .desc { margin: 6px 0 0; color: var(--muted); font-size: 13px; line-height: 1.5; word-break: break-word; }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .actions button { padding: 4px 10px; font-size: 12px; }
  .shortcuts { margin: 0; padding: 0 24px 8px; font-size: 12px; color: var(--muted); }
  .shortcuts kbd {
    display: inline-block; min-width: 18px; padding: 1px 5px; margin: 0 1px;
    border-radius: 2px; background: var(--neutral); color: var(--ink);
    font-family: inherit; font-size: 12px; font-weight: 700; text-align: center;
  }
  #status { padding: 0 24px; min-height: 20px; font-size: 13px; font-weight: 600; color: var(--danger); }
  body.modal-open { overflow: hidden; }
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    padding: 16px; background: #23272e;
  }
  .modal-backdrop[hidden], .modal-fields[hidden], .modal-message[hidden] { display: none; }
  .modal {
    width: min(480px, 100%); max-height: calc(100vh - 32px);
    overflow: auto; background: var(--panel); color: var(--ink);
    border: 0; border-radius: 4px; padding: 20px;
  }
  .modal h2 { margin: 0 0 14px; font-size: 17px; font-weight: 700; }
  .modal-message { margin: 0 0 14px; font-size: 14px; line-height: 1.6; color: var(--muted); word-break: break-word; }
  .modal-message strong { color: var(--ink); }
  .modal-fields { display: grid; gap: 12px; }
  .modal-field { display: grid; gap: 5px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .modal-field input, .modal-field textarea {
    width: 100%; padding: 9px 12px; border: 0;
    border-radius: 2px; font: inherit; font-weight: 400; color: var(--ink); background: var(--field);
  }
  .modal-field textarea { min-height: 96px; resize: vertical; }
  .modal-field input::placeholder, .modal-field textarea::placeholder { color: var(--muted); }
  .modal-field input:focus, .modal-field textarea:focus {
    outline: 2px solid var(--accent); outline-offset: 0;
  }
  .modal-error { margin: 12px 0 0; min-height: 18px; font-size: 13px; font-weight: 600; color: var(--danger); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .modal button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.danger.solid { background: var(--danger); color: #fff; }
  button.danger.solid:hover { background: var(--danger-hover); }
  button:disabled { opacity: .55; cursor: default; }
  @media (max-width: 720px) {
    #board { grid-template-columns: 1fr; }
    .add-form input { flex-basis: 100%; }
  }
</style>
</head>
<body>
<header>
  <h1>待办清单 Todo List</h1>
  <form class="add-form" id="add-form">
    <input id="new-title" name="title" placeholder="任务标题" maxlength="200" autocomplete="off" required>
    <input id="new-description" name="description" placeholder="描述（可选）" maxlength="500" autocomplete="off">
    <button class="primary" type="submit">添加</button>
  </form>
</header>
<main id="board"></main>
<p class="shortcuts">快捷键：<kbd>c</kbd> 新建 · <kbd>e</kbd> 编辑选中 · <kbd>d</kbd> 删除选中</p>
<div id="status" role="status"></div>

<div class="modal-backdrop" id="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-heading" aria-describedby="modal-message">
    <h2 id="modal-heading"></h2>
    <p class="modal-message" id="modal-message" hidden></p>
    <form id="modal-form" novalidate>
      <div class="modal-fields" id="modal-fields">
        <label class="modal-field" for="modal-title">标题
          <input id="modal-title" maxlength="200" autocomplete="off">
        </label>
        <label class="modal-field" for="modal-description">描述（可选）
          <textarea id="modal-description" maxlength="500"></textarea>
        </label>
      </div>
      <p class="modal-error" id="modal-error" role="alert"></p>
      <div class="modal-actions">
        <button type="button" id="modal-cancel">取消</button>
        <button type="submit" class="primary" id="modal-submit">保存</button>
      </div>
    </form>
  </div>
</div>

<script>
  const STATUSES = ['未开始', '进行中', '已完成'];
  const NEXT = {
    '未开始': { label: '开始', status: '进行中' },
    '进行中': { label: '完成', status: '已完成' },
    '已完成': { label: '重开', status: '未开始' },
  };
  const board = document.getElementById('board');
  const statusLine = document.getElementById('status');
  let todos = [];
  let selectedId = null; // 当前选中的任务 id（供 e/d 快捷键使用）

  async function api(path, options) {
    const res = await fetch(path, options);
    if (!res.ok) {
      let message = res.statusText;
      try { message = (await res.json()).error || message; } catch (e) {}
      throw new Error(message);
    }
    return res.status === 204 ? null : res.json();
  }

  function showError(err) {
    statusLine.textContent = err ? '⚠ ' + err.message : '';
  }

  // 点击卡片选中，为 e/d 快捷键提供目标。
  function selectTodo(id) {
    selectedId = id;
    for (const card of board.querySelectorAll('.card')) {
      card.classList.toggle('selected', card.dataset.todoId === id);
    }
  }

  function selectedTodo() {
    return todos.find(todo => todo.id === selectedId) || null;
  }

  function isEditableElement(el) {
    if (!el) return false;
    const tag = el.tagName;
    return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || el.isContentEditable;
  }

  async function load() {
    try {
      todos = await api('/api/todos');
      showError(null);
      render();
    } catch (err) {
      showError(err);
    }
  }

  function makeButton(label, className, onClick) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = label;
    if (className) btn.className = className;
    btn.addEventListener('click', onClick);
    return btn;
  }

  async function mutate(path, options) {
    try {
      await api(path, options);
      await load();
    } catch (err) {
      showError(err);
    }
  }

  function setStatus(todo, status) {
    return mutate('/api/todos/' + encodeURIComponent(todo.id), {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status: status }),
    });
  }

  // ---- 页面内模态框（编辑 / 删除确认） -------------------------------------
  const modal = document.getElementById('modal');
  const modalDialog = modal.querySelector('.modal');
  const modalHeading = document.getElementById('modal-heading');
  const modalMessage = document.getElementById('modal-message');
  const modalForm = document.getElementById('modal-form');
  const modalFields = document.getElementById('modal-fields');
  const modalTitle = document.getElementById('modal-title');
  const modalDescription = document.getElementById('modal-description');
  const modalError = document.getElementById('modal-error');
  const modalCancel = document.getElementById('modal-cancel');
  const modalSubmit = document.getElementById('modal-submit');

  let modalState = null;          // { mode: 'edit' | 'delete', todo, saving }
  let restoreFocusElement = null; // 打开弹窗时获得焦点的元素（通常是触发按钮）
  let restoreLocator = null;      // 列表刷新后用于找回对应的触发按钮
  let pressedOnBackdrop = false;

  function setModalError(message) {
    modalError.textContent = message || '';
  }

  function setModalBusy(busy) {
    if (modalState) modalState.saving = busy;
    modalSubmit.disabled = busy;
    modalCancel.disabled = busy;
    modalTitle.disabled = busy;
    modalDescription.disabled = busy;
    if (modalState && modalState.mode === 'edit') {
      modalSubmit.textContent = busy ? '保存中…' : '保存';
    } else if (modalState) {
      modalSubmit.textContent = busy ? '删除中…' : '删除';
    }
  }

  function openModal(mode, todo) {
    restoreFocusElement = document.activeElement;
    restoreLocator = { id: todo.id, action: mode };
    modalState = { mode: mode, todo: todo, saving: false };

    setModalError('');
    modalFields.hidden = mode !== 'edit';
    modalMessage.hidden = mode !== 'delete';
    modalSubmit.classList.toggle('primary', mode === 'edit');
    modalSubmit.classList.toggle('danger', mode === 'delete');
    modalSubmit.classList.toggle('solid', mode === 'delete');

    if (mode === 'edit') {
      modalHeading.textContent = '编辑任务';
      modalDialog.removeAttribute('aria-describedby');
      modalSubmit.textContent = '保存';
      modalTitle.value = todo.title;
      modalDescription.value = todo.description || '';
    } else {
      modalHeading.textContent = '删除任务';
      modalDialog.setAttribute('aria-describedby', 'modal-message');
      modalSubmit.textContent = '删除';
      modalMessage.textContent = '';
      const name = document.createElement('strong');
      name.textContent = '「' + todo.title + '」';
      modalMessage.append('确定删除 ', name, '？此操作不可恢复。');
    }

    modal.hidden = false;
    document.body.classList.add('modal-open');
    setModalBusy(false);
    if (mode === 'edit') {
      modalTitle.focus();
      modalTitle.select();
    } else {
      modalSubmit.focus();
    }
  }

  function focusAction(locator) {
    if (!locator) return;
    const selector = 'button[data-todo-id="' + CSS.escape(locator.id) + '"]' +
      '[data-action="' + locator.action + '"]';
    const target = board.querySelector(selector);
    if (target) target.focus();
  }

  function closeModal(refocus) {
    modal.hidden = true;
    document.body.classList.remove('modal-open');
    modalState = null;
    const previous = restoreFocusElement;
    const locator = restoreLocator;
    restoreFocusElement = null;
    restoreLocator = null;
    setModalBusy(false);
    if (refocus === false) return;
    // 列表尚未刷新时触发按钮仍然存在；刷新后用 data 属性找回新生按钮。
    if (previous && previous.isConnected) previous.focus();
    else focusAction(locator);
  }

  function modalFocusables() {
    return Array.from(modal.querySelectorAll(
      'button, input, textarea, select, a[href], [tabindex]:not([tabindex="-1"])'
    )).filter(el => !el.disabled && !el.hidden && el.offsetParent !== null);
  }

  async function submitModal() {
    if (!modalState || modalState.saving) return;
    const todo = modalState.todo;
    setModalError('');
    setModalBusy(true);

    let path = '/api/todos/' + encodeURIComponent(todo.id);
    let options;
    if (modalState.mode === 'edit') {
      const title = modalTitle.value.trim();
      if (!title) {
        setModalError('标题不能为空');
        setModalBusy(false);
        modalTitle.focus();
        return;
      }
      options = {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: title, description: modalDescription.value.trim() }),
      };
    } else {
      options = { method: 'DELETE' };
    }

    const locator = restoreLocator;
    try {
      await api(path, options);
      closeModal(false);
      await load();
      focusAction(locator);
    } catch (err) {
      setModalError(err.message);
      setModalBusy(false);
      if (modalState && modalState.mode === 'edit') modalTitle.focus();
      else modalSubmit.focus();
    }
  }

  modalForm.addEventListener('submit', event => {
    event.preventDefault();
    submitModal();
  });
  modalCancel.addEventListener('click', () => closeModal());

  // Esc 关闭；Tab 在弹窗内循环（简单 focus trap）。
  modal.addEventListener('keydown', event => {
    if (event.key === 'Escape') {
      event.preventDefault();
      if (!modalState || !modalState.saving) closeModal();
      return;
    }
    if (event.key !== 'Tab') return;
    const items = modalFocusables();
    if (items.length === 0) return;
    const first = items[0];
    const last = items[items.length - 1];
    if (!modal.contains(document.activeElement)) {
      event.preventDefault();
      first.focus();
    } else if (event.shiftKey && document.activeElement === first) {
      event.preventDefault();
      last.focus();
    } else if (!event.shiftKey && document.activeElement === last) {
      event.preventDefault();
      first.focus();
    }
  });

  // 点击遮罩关闭（按在遮罩上并松开才算，避免从弹窗内拖选到外面误关）。
  modal.addEventListener('mousedown', event => {
    pressedOnBackdrop = event.target === modal;
  });
  modal.addEventListener('click', event => {
    const shouldClose = pressedOnBackdrop && event.target === modal;
    pressedOnBackdrop = false;
    if (shouldClose && modalState && !modalState.saving) closeModal();
  });

  function editTodo(todo) {
    openModal('edit', todo);
  }

  function deleteTodo(todo) {
    openModal('delete', todo);
  }

  function renderCard(todo) {
    const card = document.createElement('article');
    card.className = 'card';
    card.dataset.todoId = todo.id;
    card.classList.toggle('selected', todo.id === selectedId);
    card.addEventListener('click', () => selectTodo(todo.id));

    const title = document.createElement('h3');
    title.textContent = (todo.status === '已完成' ? '✓ ' : '') + todo.title;
    if (todo.status === '已完成') title.className = 'done';
    card.appendChild(title);

    if (todo.description) {
      const desc = document.createElement('p');
      desc.className = 'desc';
      desc.textContent = todo.description;
      card.appendChild(desc);
    }

    const actions = document.createElement('div');
    actions.className = 'actions';
    const next = NEXT[todo.status];
    if (next) {
      const nextBtn = makeButton(next.label, '', () => setStatus(todo, next.status));
      nextBtn.dataset.todoId = todo.id;
      nextBtn.dataset.action = 'next';
      actions.appendChild(nextBtn);
    }
    const editBtn = makeButton('编辑', '', () => editTodo(todo));
    editBtn.dataset.todoId = todo.id;
    editBtn.dataset.action = 'edit';
    actions.appendChild(editBtn);
    const deleteBtn = makeButton('删除', 'danger', () => deleteTodo(todo));
    deleteBtn.dataset.todoId = todo.id;
    deleteBtn.dataset.action = 'delete';
    actions.appendChild(deleteBtn);
    card.appendChild(actions);
    return card;
  }

  function render() {
    // 选中的任务可能已被删除，此时清除选中态。
    if (selectedId && !todos.some(todo => todo.id === selectedId)) selectedId = null;
    board.textContent = '';
    for (const status of STATUSES) {
      const column = document.createElement('section');
      column.className = 'column' + (status === '进行中' ? ' active' : '');

      const heading = document.createElement('h2');
      heading.textContent = status;
      column.appendChild(heading);

      const items = todos.filter(todo => todo.status === status);
      if (items.length === 0) {
        const empty = document.createElement('p');
        empty.className = 'empty';
        empty.textContent = '暂无任务';
        column.appendChild(empty);
      } else {
        for (const todo of items) column.appendChild(renderCard(todo));
      }
      board.appendChild(column);
    }
  }

  document.getElementById('add-form').addEventListener('submit', async event => {
    event.preventDefault();
    const titleInput = document.getElementById('new-title');
    const descInput = document.getElementById('new-description');
    const title = titleInput.value.trim();
    if (!title) return;
    try {
      await api('/api/todos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: title, description: descInput.value.trim() }),
      });
      titleInput.value = '';
      descInput.value = '';
      titleInput.focus();
      await load();
    } catch (err) {
      showError(err);
    }
  });

  // ---- 快捷键 ---------------------------------------------------------------
  // 输入框内、或弹窗打开时（Esc 由弹窗自行处理）不响应快捷键。
  document.addEventListener('keydown', event => {
    if (event.defaultPrevented || event.isComposing) return;
    if (event.ctrlKey || event.metaKey || event.altKey) return;
    if (modalState) return;

    if (event.key === 'Escape') {
      if (isEditableElement(document.activeElement)) document.activeElement.blur();
      return;
    }

    if (isEditableElement(document.activeElement)) return;

    if (event.key.toLowerCase() === 'c') {
      event.preventDefault();
      document.getElementById('new-title').focus();
      return;
    }

    const todo = selectedTodo();
    if (!todo) return;

    if (event.key.toLowerCase() === 'e') {
      event.preventDefault();
      editTodo(todo);
    } else if (event.key.toLowerCase() === 'd' || event.key === 'Delete') {
      event.preventDefault();
      deleteTodo(todo);
    }
  });

  load();
</script>
</body>
</html>
